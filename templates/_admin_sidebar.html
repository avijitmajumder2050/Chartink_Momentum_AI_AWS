<div style="width: 232px; flex-shrink: 0; background: #14171F; min-height: 100vh; padding: 22px 16px; display: flex; flex-direction: column; gap: 4px;">
  <div style="display: flex; align-items: center; gap: 9px; padding: 8px 10px 22px;">
    <svg width="24" height="24" viewBox="0 0 30 30" fill="none"><rect width="30" height="30" rx="8" fill="#4640DE"/><path d="M7 20L12.5 12.5L16.5 17L23 8" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8H23V13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 16px; color: white;">Quantile <span style="color: #9297A8; font-weight: 600; font-size: 12px;">Admin</span></span>
  </div>
  {% for n in nav_items %}
  {% set is_active = n.label == active_admin_tab %}
  <a href="{{ url_for(n.endpoint) }}" style="display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px; background: {{ '#1F2330' if is_active else 'transparent' }}; text-decoration: none;">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{ '#FFFFFF' if is_active else '#9297A8' }}" stroke-width="1.6"><rect x="2" y="2" width="12" height="12" rx="2.5"/></svg>
    <span style="font-size: 13.5px; font-weight: {{ '700' if is_active else '500' }}; color: {{ '#FFFFFF' if is_active else '#9297A8' }};">{{ n.label }}</span>
  </a>
  {% endfor %}
  <div style="flex: 1;"></div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #2A2E3A; margin-top: 10px;">
    <div style="width: 30px; height: 30px; border-radius: 50%; background: #4640DE; color: white; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{ current_user.name[:2] | upper }}</div>
    <div style="min-width: 0;">
      <span style="font-size: 12.5px; font-weight: 700; color: white; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ current_user.name }}</span>
      <span style="font-size: 11px; color: #8A90A0;">Admin</span>
    </div>
  </div>
</div>
