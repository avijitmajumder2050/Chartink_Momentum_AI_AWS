<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quantile backend control</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #FAF9F6; color: #14171F; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
  .card { background: #FFFFFF; border: 1px solid #E3E6EC; border-radius: 16px; padding: 32px; max-width: 380px; width: 100%; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { font-size: 12.5px; color: #8A90A0; margin: 0 0 24px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
  .state-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 22px; }
  button { width: 100%; padding: 12px 0; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-start { background: #17A673; color: white; }
  .btn-stop { background: #E0473F; color: white; }
  .note { font-size: 11.5px; color: #8A90A0; margin-top: 16px; line-height: 1.5; }
  .msg { font-size: 12.5px; margin-top: 14px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Quantile staging backend</h1>
    <p class="sub">Standalone control — not part of the main app.</p>
    <div class="state-row">
      <span class="dot" id="dot" style="background:#C6C9D2"></span>
      <span id="stateLabel">Checking…</span>
    </div>
    <button id="toggleBtn" disabled>…</button>
    <div class="msg" id="msg"></div>
    <p class="note">After starting, CloudFront can take a few minutes to pick up the new instance address — the API may 502/504 briefly even once the instance shows "running".</p>
  </div>

<script>
  // Fill these in after deploying the API Gateway + Lambda.
  const API_BASE = "https://5k5etz73r9.execute-api.ap-south-1.amazonaws.com/prod/";
  const TRIGGER_KEY = "__TRIGGER_KEY__";

  const dot = document.getElementById("dot");
  const stateLabel = document.getElementById("stateLabel");
  const btn = document.getElementById("toggleBtn");
  const msg = document.getElementById("msg");

  function setState(state) {
    if (state === "running") {
      dot.style.background = "#17A673";
      stateLabel.textContent = "Running";
      btn.textContent = "Stop backend";
      btn.className = "btn-stop";
      btn.dataset.action = "stop";
    } else if (state === "stopped") {
      dot.style.background = "#8A90A0";
      stateLabel.textContent = "Stopped";
      btn.textContent = "Start backend";
      btn.className = "btn-start";
      btn.dataset.action = "start";
    } else {
      dot.style.background = "#B98A2E";
      stateLabel.textContent = state || "Unknown";
      btn.textContent = "Refresh";
      btn.className = "btn-start";
      btn.dataset.action = "status";
    }
    btn.disabled = false;
  }

  async function call(action) {
    const res = await fetch(`${API_BASE}?action=${action}`, {
      headers: { "x-trigger-key": TRIGGER_KEY },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  async function refresh() {
    try {
      const data = await call("status");
      setState(data.state);
      msg.textContent = "";
    } catch (err) {
      stateLabel.textContent = "Error";
      msg.textContent = err.message;
    }
  }

  btn.addEventListener("click", async () => {
    const action = btn.dataset.action;
    btn.disabled = true;
    msg.textContent = action === "start" ? "Starting…" : action === "stop" ? "Stopping…" : "Checking…";
    try {
      const data = await call(action);
      if (data.publicDns) {
        msg.textContent = `Running at ${data.publicDns}${data.cloudfrontUpdating ? " — CloudFront origin updated, propagating…" : ""}`;
      } else {
        msg.textContent = data.status || "Done";
      }
      setTimeout(refresh, 3000);
    } catch (err) {
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });

  refresh();
</script>
</body>
</html>
